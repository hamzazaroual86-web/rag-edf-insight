services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    container_name: rag-edf-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - CHROMA_PATH=/app/vectorstore
    volumes:
      - ./vectorstore:/app/vectorstore
    depends_on:
      - ollama

volumes:
  ollama_data: